<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.8)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.15">
    <line x1="0" y1="70" x2="800" y2="70" stroke="#38bdf8" stroke-width="1"/>
    <line x1="0" y1="140" x2="800" y2="140" stroke="#38bdf8" stroke-width="0.5"/>
    <line x1="0" y1="210" x2="800" y2="210" stroke="#38bdf8" stroke-width="0.5"/>
    <line x1="0" y1="280" x2="800" y2="280" stroke="#38bdf8" stroke-width="0.5"/>
    <line x1="0" y1="350" x2="800" y2="350" stroke="#38bdf8" stroke-width="0.5"/>
    <line x1="0" y1="420" x2="800" y2="420" stroke="#38bdf8" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="500" stroke="#38bdf8" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="500" stroke="#38bdf8" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="500" stroke="#38bdf8" stroke-width="0.5"/>
  </g>

  <!-- Browser Header Bar -->
  <rect x="0" y="0" width="800" height="50" rx="16" fill="#090d16" />
  <rect x="0" y="30" width="800" height="20" fill="#090d16" />
  <circle cx="28" cy="25" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="48" cy="25" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="68" cy="25" r="6" fill="#10b981" opacity="0.8"/>
  
  <rect x="110" y="12" width="450" height="26" rx="13" fill="#131b2e" stroke="rgba(255,255,255,0.08)"/>
  <text x="135" y="29" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">https://g-shop.app/groceries • Voice Search Active</text>
  
  <!-- Voice Search Pulsing Wave Badge -->
  <rect x="580" y="12" width="130" height="26" rx="13" fill="rgba(0, 242, 254, 0.15)" stroke="#00f2fe" stroke-width="1"/>
  <circle cx="598" cy="25" r="5" fill="#00f2fe" filter="url(#glow)"/>
  <text x="612" y="29" fill="#00f2fe" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">🎙 Voice Search</text>

  <!-- Main Content Layout -->
  <!-- Header / Hero Banner in App -->
  <rect x="30" y="70" width="740" height="110" rx="12" fill="url(#cardGrad)" stroke="rgba(0, 242, 254, 0.2)"/>
  <text x="60" y="112" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="22" font-weight="bold">Fresh Organic Groceries Delivered</text>
  <text x="60" y="138" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">MERN Stack Architecture • Instant Voice Recognition • Razorpay Test Flow</text>
  
  <!-- Search Bar with Microphone -->
  <rect x="60" y="152" width="460" height="40" rx="8" fill="#090d16" stroke="#00f2fe" stroke-width="1.5" filter="url(#glow)"/>
  <text x="80" y="177" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13">"Listening: 'Fresh Strawberries and Almond Milk'..."</text>
  <rect x="440" y="157" width="70" height="30" rx="6" fill="url(#cyanGrad)"/>
  <text x="458" y="177" fill="#070b14" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">Search</text>

  <!-- Product Grid -->
  <!-- Card 1 -->
  <rect x="30" y="200" width="225" height="260" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.06)"/>
  <rect x="45" y="215" width="195" height="120" rx="8" fill="#131d33"/>
  <circle cx="142" cy="275" r="36" fill="#10b981" opacity="0.2"/>
  <text x="122" y="285" fill="#10b981" font-size="30">🥑</text>
  <text x="45" y="360" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold">Hass Avocados</text>
  <text x="45" y="380" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12">Organic • 4 pcs</text>
  <text x="45" y="415" fill="#00f2fe" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold">₹180</text>
  <rect x="155" y="395" width="85" height="30" rx="6" fill="#00f2fe" opacity="0.2" stroke="#00f2fe"/>
  <text x="170" y="415" fill="#00f2fe" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">+ Add</text>

  <!-- Card 2 -->
  <rect x="285" y="200" width="225" height="260" rx="10" fill="url(#cardGrad)" stroke="rgba(0, 242, 254, 0.3)"/>
  <rect x="300" y="215" width="195" height="120" rx="8" fill="#131d33"/>
  <circle cx="397" cy="275" r="36" fill="#ef4444" opacity="0.2"/>
  <text x="377" y="285" fill="#ef4444" font-size="30">🍓</text>
  <text x="300" y="360" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold">Sweet Strawberries</text>
  <text x="300" y="380" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12">Fresh Harvest • 500g</text>
  <text x="300" y="415" fill="#00f2fe" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold">₹220</text>
  <rect x="410" y="395" width="85" height="30" rx="6" fill="#00f2fe"/>
  <text x="428" y="415" fill="#070b14" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">In Cart (1)</text>

  <!-- Card 3 / Cart Checkout Drawer Preview -->
  <rect x="540" y="200" width="230" height="260" rx="10" fill="#0b1120" stroke="rgba(139, 92, 246, 0.4)"/>
  <rect x="540" y="200" width="230" height="42" rx="10" fill="#151d33"/>
  <text x="560" y="226" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">🛒 Cart & Checkout (2 items)</text>
  
  <text x="560" y="270" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Sweet Strawberries (1x)</text>
  <text x="715" y="270" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">₹220</text>
  
  <text x="560" y="300" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Organic Almond Milk (1x)</text>
  <text x="715" y="300" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">₹150</text>
  
  <line x1="560" y1="325" x2="745" y2="325" stroke="rgba(255,255,255,0.1)"/>
  <text x="560" y="348" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">Total Amount</text>
  <text x="710" y="348" fill="#00f2fe" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">₹370</text>
  
  <!-- Razorpay Test Mode Badge -->
  <rect x="560" y="370" width="190" height="24" rx="4" fill="rgba(245, 158, 11, 0.12)" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="575" y="386" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">⚡ Razorpay Test Sandbox</text>
  
  <rect x="560" y="405" width="190" height="34" rx="6" fill="url(#cyanGrad)"/>
  <text x="610" y="427" fill="#070b14" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">Proceed to Pay</text>
</svg>
