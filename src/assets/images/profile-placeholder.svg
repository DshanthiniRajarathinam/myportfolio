<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#151e33"/>
      <stop offset="100%" stop-color="#080d19"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 242, 254, 0.25)"/>
      <stop offset="60%" stop-color="rgba(139, 92, 246, 0.1)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Outer Container -->
  <circle cx="250" cy="250" r="230" fill="url(#avatarBg)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2"/>
  <circle cx="250" cy="250" r="220" fill="url(#centerGlow)"/>

  <!-- Concentric Rings & Geometry -->
  <circle cx="250" cy="250" r="195" fill="none" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5" stroke-dasharray="6 8"/>
  <circle cx="250" cy="250" r="165" fill="none" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.5" stroke-dasharray="12 6"/>
  <circle cx="250" cy="250" r="135" fill="#0d1424" stroke="url(#accentGlow)" stroke-width="3" filter="url(#shadowGlow)"/>

  <!-- Monogram Initials "DR" -->
  <text x="250" y="275" 
        text-anchor="middle" 
        font-family="-apple-system, 'Plus Jakarta Sans', sans-serif" 
        font-size="82" 
        font-weight="800" 
        fill="url(#accentGlow)" 
        letter-spacing="4">DR</text>

  <!-- Title Badge Under Initials -->
  <rect x="145" y="305" width="210" height="30" rx="15" fill="rgba(0, 242, 254, 0.12)" stroke="#00f2fe" stroke-width="1"/>
  <text x="250" y="325" 
        text-anchor="middle" 
        font-family="-apple-system, 'Plus Jakarta Sans', sans-serif" 
        font-size="11" 
        font-weight="bold" 
        fill="#00f2fe" 
        letter-spacing="1">DSHANTHINI R</text>

  <!-- Tagline under Badge -->
  <text x="250" y="360" 
        text-anchor="middle" 
        font-family="-apple-system, sans-serif" 
        font-size="11" 
        font-weight="600" 
        fill="#94a3b8">MERN Stack • UI/UX Designer</text>

  <!-- Subtitle Prompt -->
  <text x="250" y="420" 
        text-anchor="middle" 
        font-family="-apple-system, sans-serif" 
        font-size="10" 
        fill="#64748b">Profile Photo Asset Slot: src/assets/images/profile.png</text>
</svg>
