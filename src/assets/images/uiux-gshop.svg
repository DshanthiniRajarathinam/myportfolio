<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="figmaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1322"/>
      <stop offset="50%" stop-color="#182038"/>
      <stop offset="100%" stop-color="#0a0e19"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#figmaGrad)"/>

  <!-- Figma Canvas Tooling Bar -->
  <rect x="0" y="0" width="800" height="42" fill="#080c14" />
  <text x="24" y="26" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">❖ Figma</text>
  <text x="90" y="26" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">/ G-Shop Design System &amp; Mobile UI v2.4</text>
  <rect x="710" y="8" width="70" height="26" rx="4" fill="#00f2fe" opacity="0.15" stroke="#00f2fe"/>
  <text x="724" y="25" fill="#00f2fe" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">Share</text>

  <!-- Canvas Frame 1: Mobile Screen 1 (Product Discovery) -->
  <g transform="translate(60, 65)">
    <rect width="195" height="390" rx="28" fill="#0a0f1d" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <!-- Phone notch -->
    <rect x="62" y="10" width="70" height="14" rx="7" fill="#1e293b"/>
    <!-- App Header -->
    <text x="20" y="52" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">Discover</text>
    <circle cx="170" cy="48" r="12" fill="#1e293b"/>
    <!-- Search Bar -->
    <rect x="18" y="70" width="160" height="32" rx="16" fill="#131d33" stroke="rgba(0, 242, 254, 0.4)"/>
    <text x="32" y="90" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">🔍 Search or Voice...</text>
    <!-- Category Pills -->
    <rect x="18" y="112" width="46" height="20" rx="10" fill="#00f2fe"/>
    <text x="26" y="126" fill="#070b14" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold">All</text>
    <rect x="70" y="112" width="56" height="20" rx="10" fill="#1e293b"/>
    <text x="78" y="126" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">Fruits</text>
    <rect x="132" y="112" width="46" height="20" rx="10" fill="#1e293b"/>
    <text x="139" y="126" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">Dairy</text>
    <!-- Featured Card -->
    <rect x="18" y="142" width="160" height="100" rx="12" fill="linear-gradient(135deg, #0284c7 0%, #0369a1 100%)"/>
    <text x="30" y="175" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">Fresh Harvest</text>
    <text x="30" y="195" fill="#bae6fd" font-family="-apple-system, sans-serif" font-size="10">Get 20% OFF Daily</text>
    <!-- Product Row -->
    <rect x="18" y="254" width="75" height="105" rx="8" fill="#131d33"/>
    <text x="48" y="285" fill="#ffffff" font-size="20">🍎</text>
    <text x="26" y="315" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold">Apples</text>
    <text x="26" y="332" fill="#00f2fe" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold">₹140</text>
    
    <rect x="102" y="254" width="75" height="105" rx="8" fill="#131d33"/>
    <text x="130" y="285" fill="#ffffff" font-size="20">🥦</text>
    <text x="110" y="315" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold">Broccoli</text>
    <text x="110" y="332" fill="#00f2fe" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold">₹90</text>
    
    <!-- Bottom Nav -->
    <rect x="0" y="350" width="195" height="40" rx="20" fill="#0c1222"/>
    <circle cx="40" cy="370" r="4" fill="#00f2fe"/>
    <circle cx="97" cy="370" r="4" fill="#64748b"/>
    <circle cx="155" cy="370" r="4" fill="#64748b"/>
  </g>

  <!-- Canvas Frame 2: Voice Interaction Active Overlay -->
  <g transform="translate(295, 65)">
    <rect width="195" height="390" rx="28" fill="#0a0f1d" stroke="rgba(0, 242, 254, 0.4)" stroke-width="2"/>
    <!-- Phone notch -->
    <rect x="62" y="10" width="70" height="14" rx="7" fill="#1e293b"/>
    <!-- Voice Modal sheet -->
    <rect x="12" y="120" width="171" height="230" rx="16" fill="#10182b" stroke="rgba(0, 242, 254, 0.3)"/>
    <circle cx="97" cy="180" r="32" fill="rgba(0, 242, 254, 0.15)" stroke="#00f2fe" stroke-width="2"/>
    <text x="89" y="188" fill="#00f2fe" font-size="22">🎙</text>
    <text x="45" y="235" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">Listening for grocery...</text>
    <text x="35" y="255" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">Say "Find Organic Honey"</text>
    <!-- Waveform visualization -->
    <g transform="translate(48, 275)">
      <line x1="10" y1="20" x2="10" y2="0" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>
      <line x1="25" y1="26" x2="25" y2="-6" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>
      <line x1="40" y1="30" x2="40" y2="-12" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      <line x1="55" y1="24" x2="55" y2="-4" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
      <line x1="70" y1="18" x2="70" y2="2" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>
      <line x1="85" y1="22" x2="85" y2="-2" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- Cancel button -->
    <rect x="52" y="318" width="90" height="22" rx="11" fill="#1e293b"/>
    <text x="75" y="333" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">Cancel</text>
  </g>

  <!-- Right Side: Design System Tokens & Color Swatches -->
  <g transform="translate(525, 65)">
    <rect width="235" height="390" rx="12" fill="#0b101c" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="32" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">Design System Spec</text>
    
    <!-- Color Swatches -->
    <text x="20" y="65" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Color Palette Tokens</text>
    
    <rect x="20" y="78" width="40" height="40" rx="8" fill="#00f2fe"/>
    <rect x="70" y="78" width="40" height="40" rx="8" fill="#38bdf8"/>
    <rect x="120" y="78" width="40" height="40" rx="8" fill="#8b5cf6"/>
    <rect x="170" y="78" width="40" height="40" rx="8" fill="#10b981"/>
    
    <text x="20" y="132" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">#00F2FE</text>
    <text x="70" y="132" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">#38BDF8</text>
    <text x="120" y="132" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">#8B5CF6</text>
    <text x="170" y="132" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">#10B981</text>

    <!-- Typography Hierarchy -->
    <text x="20" y="170" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Typography Scale</text>
    <rect x="20" y="182" width="195" height="90" rx="8" fill="#121829"/>
    <text x="32" y="206" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">H1 Display / 24px</text>
    <text x="32" y="230" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Subheading / 16px</text>
    <text x="32" y="252" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Body copy &amp; micro labels / 12px</text>

    <!-- Micro-interaction Notes -->
    <text x="20" y="298" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Interaction Tokens</text>
    <rect x="20" y="310" width="195" height="60" rx="8" fill="#121829"/>
    <text x="32" y="332" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11">❖ Fast Drag Cart Drawer</text>
    <text x="32" y="352" fill="#8b5cf6" font-family="-apple-system, sans-serif" font-size="11">❖ Voice Wave Pulse Motion</text>
  </g>
</svg>
