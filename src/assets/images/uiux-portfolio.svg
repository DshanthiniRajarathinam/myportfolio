<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="portGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#portGrad)"/>

  <!-- Figma Canvas Tooling Bar -->
  <rect x="0" y="0" width="800" height="42" fill="#080c14" />
  <text x="24" y="26" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">❖ Figma</text>
  <text x="90" y="26" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">/ Developer Portfolio Identity &amp; Component System</text>

  <!-- Visual Grid & Layout Wireframe -->
  <g transform="translate(45, 65)">
    <!-- Main Artboard -->
    <rect width="460" height="390" rx="12" fill="#070a12" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1.5"/>
    
    <!-- Navbar wireframe -->
    <rect x="20" y="20" width="420" height="32" rx="16" fill="#0f1524" stroke="rgba(255,255,255,0.08)"/>
    <text x="40" y="41" fill="#00f2fe" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">DSHANTHINI.R</text>
    <text x="220" y="40" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">About   Skills   Projects   UI/UX   Contact</text>
    <rect x="360" y="25" width="70" height="22" rx="11" fill="url(#cyberGrad)"/>
    <text x="375" y="39" fill="#070a12" font-family="-apple-system, sans-serif" font-size="8" font-weight="bold">Let's Talk</text>

    <!-- Hero layout wireframe -->
    <rect x="30" y="70" width="130" height="20" rx="10" fill="rgba(0, 242, 254, 0.15)"/>
    <text x="42" y="83" fill="#00f2fe" font-family="-apple-system, sans-serif" font-size="8" font-weight="bold">● AVAILABLE FOR ROLES</text>
    
    <text x="30" y="125" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="22" font-weight="bold">Hi, I'm Dshanthini</text>
    <text x="30" y="150" fill="#8b5cf6" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">MERN Stack Developer &amp; UI/UX Designer</text>
    
    <!-- Wireframe profile avatar with orbiting tags -->
    <g transform="translate(320, 150)">
      <circle cx="50" cy="50" r="52" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="4 4"/>
      <circle cx="50" cy="50" r="44" fill="#131b2e" stroke="rgba(139, 92, 246, 0.4)" stroke-width="2"/>
      <text x="36" y="58" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="bold">DR</text>
      <!-- Orbit badge 1 -->
      <rect x="-15" y="10" width="46" height="18" rx="9" fill="#090d16" stroke="#00f2fe"/>
      <text x="-9" y="22" fill="#00f2fe" font-size="8">⚛ React</text>
      <!-- Orbit badge 2 -->
      <rect x="68" y="75" width="46" height="18" rx="9" fill="#090d16" stroke="#8b5cf6"/>
      <text x="74" y="87" fill="#8b5cf6" font-size="8">❖ Figma</text>
    </g>

    <!-- Project Card Wireframe Mockup -->
    <rect x="30" y="250" width="190" height="110" rx="8" fill="#0f1524" stroke="rgba(255,255,255,0.06)"/>
    <rect x="40" y="260" width="170" height="50" rx="6" fill="#151e33"/>
    <text x="40" y="325" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold">G-Shop MERN Platform</text>
    <text x="40" y="342" fill="#64748b" font-family="-apple-system, sans-serif" font-size="8">Full Stack + Voice Search</text>

    <rect x="235" y="250" width="190" height="110" rx="8" fill="#0f1524" stroke="rgba(255,255,255,0.06)"/>
    <rect x="245" y="260" width="170" height="50" rx="6" fill="#151e33"/>
    <text x="245" y="325" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold">Loan Eligibility Engine</text>
    <text x="245" y="342" fill="#64748b" font-family="-apple-system, sans-serif" font-size="8">Java + MySQL + JDBC</text>
  </g>

  <!-- Right: Component Library Tokens -->
  <g transform="translate(530, 65)">
    <rect width="225" height="390" rx="12" fill="#0c1220" stroke="rgba(255,255,255,0.08)"/>
    <text x="18" y="32" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">Atomic Components</text>
    
    <!-- Button states -->
    <text x="18" y="65" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Button Variant Tokens</text>
    <rect x="18" y="78" width="188" height="32" rx="16" fill="url(#cyberGrad)"/>
    <text x="65" y="99" fill="#070a12" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">Primary Glow Button</text>

    <rect x="18" y="120" width="188" height="32" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.15)"/>
    <text x="68" y="141" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">Secondary Outline</text>

    <!-- Glass Cards Token -->
    <text x="18" y="185" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Glassmorphism Elevation</text>
    <rect x="18" y="198" width="188" height="75" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(0, 242, 254, 0.25)"/>
    <text x="30" y="224" fill="#00f2fe" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold">Level 2 Surface</text>
    <text x="30" y="242" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">backdrop-filter: blur(14px)</text>
    <text x="30" y="258" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">box-shadow: 0 10px 30px rgba(0,0,0,0.5)</text>

    <!-- Cursor Follower Token -->
    <text x="18" y="305" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Cursor Interaction Spec</text>
    <circle cx="36" cy="336" r="16" fill="none" stroke="#00f2fe" stroke-width="1.5"/>
    <circle cx="36" cy="336" r="4" fill="#00f2fe"/>
    <text x="64" y="333" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Reactive Cursor Follower</text>
    <text x="64" y="348" fill="#64748b" font-family="-apple-system, sans-serif" font-size="8">Expands on hover • Dot inside</text>
  </g>
</svg>
